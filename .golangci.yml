version: '2'
linters:
  default: standard
  enable:
    [
      bidichk,
      bodyclose,
      contextcheck,
      copyloopvar,
      durationcheck,
      errchkjson,
      errname,
      errorlint,
      exhaustive,
      fatcontext,
      gocheckcompilerdirectives,
      gocritic,
      goprintffuncname,
      gosec,
      intrange,
      makezero,
      misspell,
      modernize,
      nilerr,
      nilnesserr,
      nilnil,
      noctx,
      nolintlint,
      perfsprint,
      predeclared,
      recvcheck,
      revive,
      rowserrcheck,
      sloglint,
      sqlclosecheck,
      testifylint,
      thelper,
      tparallel,
      unconvert,
      unparam,
      usestdlibvars,
      usetesting,
      wastedassign,
      whitespace,
    ]
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable: [nilness, shadow, unusedwrite, waitgroup]
      settings:
        shadow:
          strict: false
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: modifies-value-receiver
        - name: redefines-builtin-id
        - name: unused-parameter
        - name: unused-receiver
  exclusions:
    generated: strict
    presets: [common-false-positives, std-error-handling]
formatters:
  enable: [goimports]
  exclusions:
    generated: strict
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
run:
  timeout: 5m
  tests: true
